name: Import Firefox ESR

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Firefox ESR git tag"
        required: true
        default: "FIREFOX_153_0esr_RELEASE"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clone Firefox at the ESR tag
        run: |
          git clone --depth 1 --branch "${{ inputs.tag }}" \
            https://github.com/mozilla-firefox/firefox.git src

      - name: Create clean snapshot and push to esr branch
        run: |
          cd src
          rm -rf .git .github/workflows
          git init -b esr
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -m "Import Firefox ${{ inputs.tag }} snapshot"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:esr
